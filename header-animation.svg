<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes dash {
      to {
        stroke-dashoffset: 0;
      }
    }
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    .rotating {
      animation: rotate 10s linear infinite;
      transform-origin: center;
    }
    .path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 5s linear forwards;
    }
    .text-reveal {
      opacity: 0;
      animation: fadeIn 2s ease-in forwards;
      animation-delay: calc(var(--index) * 0.3s);
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .gradient-text {
      fill: url(#gradient);
    }
  </style>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2387">
        <animate attributeName="stop-color" values="#8A2387; #E94057; #F27121; #8A2387" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#E94057">
        <animate attributeName="stop-color" values="#E94057; #F27121; #8A2387; #E94057" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#F27121">
        <animate attributeName="stop-color" values="#F27121; #8A2387; #E94057; #F27121" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="400" fill="#0d1117" />
  
  <!-- Background Circles -->
  <circle cx="400" cy="200" r="180" fill="none" stroke="url(#gradient)" stroke-width="2" class="rotating" />
  <circle cx="400" cy="200" r="150" fill="none" stroke="url(#gradient)" stroke-width="2" opacity="0.7" class="rotating" style="animation-direction: reverse;" />
  
  <!-- Code Symbol -->
  <g class="floating" filter="url(#glow)">
    <path d="M300,200 L250,250 L300,300" fill="none" stroke="#61DAFB" stroke-width="8" stroke-linecap="round" class="path" />
    <path d="M500,200 L550,250 L500,300" fill="none" stroke="#61DAFB" stroke-width="8" stroke-linecap="round" class="path" />
    <path d="M350,150 L450,350" fill="none" stroke="#FF5E5B" stroke-width="8" stroke-linecap="round" class="path" />
  </g>
  
  <!-- GitHub Icon -->
  <g transform="translate(400, 200) scale(0.7)" class="floating" style="animation-delay: -2s;">
    <circle cx="0" cy="0" r="50" fill="#0d1117" stroke="url(#gradient)" stroke-width="5" />
    <path d="M0,-25 C-13.75,-25 -25,-13.75 -25,0 C-25,10.94 -18.13,20.31 -8.44,23.75 C-7.5,23.91 -7.19,23.28 -7.19,22.72 C-7.19,22.22 -7.19,20.53 -7.19,19.53 C-15,20.22 -17.19,15.44 -17.19,15.44 C-19.06,11.94 -21.41,11.25 -21.41,11.25 C-24.5,10.03 -21.25,10.03 -21.25,10.03 C-17.97,10.19 -16.25,12.03 -16.25,12.03 C-13.75,16.53 -8.91,15.63 -7.03,15.16 C-6.88,14.38 -6.41,13.78 -5.94,13.44 C-12.5,13.13 -19.38,10.03 -19.38,0 C-19.38,-4.22 -17.97,-7.66 -16.09,-9.53 C-16.41,-10.03 -17.66,-12.5 -16.25,-16.56 C-16.25,-16.56 -13.75,-17.19 -7.19,-13.44 C-4.84,-14.06 -2.34,-14.38 0.16,-14.38 C2.66,-14.38 5.16,-14.06 7.5,-13.44 C14.06,-17.19 16.56,-16.56 16.56,-16.56 C17.97,-12.5 16.72,-10.03 16.41,-9.53 C18.28,-7.66 19.69,-4.22 19.69,0 C19.69,10.03 12.81,13.13 6.25,13.44 C6.88,13.91 7.5,14.69 7.5,16.09 C7.5,18.13 7.5,22.03 7.5,22.72 C7.5,23.28 7.81,23.91 8.75,23.75 C18.44,20.31 25.31,10.94 25.31,0 C25.31,-13.75 14.06,-25 0.31,-25 L0,-25 Z" fill="white" />
  </g>
  
  <!-- Text -->
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="30" font-weight="bold" text-anchor="middle" class="gradient-text">
    <tspan x="400" class="text-reveal" style="--index: 1;">Peter Martin</tspan>
  </text>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle" class="text-reveal" style="--index: 2;">Software Developer | Creative Coder</text>
</svg>